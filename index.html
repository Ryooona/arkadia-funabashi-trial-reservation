<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Arkadia船橋店 ポーカー体験会 お申し込み</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --green: #06c755;
      --green-disabled: #75dda0;
      --ink: #202124;
      --muted: #6b7280;
      --line: #cfd4dc;
      --background: #f6f7f8;
      --error: #dc2626;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: var(--background);
      color: var(--ink);
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.4;
    }

    .description {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      margin-left: 6px;
      color: var(--error);
      font-size: 12px;
      font-weight: 600;
    }

    .optional {
      margin-left: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    .datetime-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px 82px;
      gap: 8px;
    }

    .datetime-row > * {
      min-width: 0;
    }

    .hint {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 8px;
      padding: 13px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: var(--green-disabled);
      cursor: default;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: var(--success);
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--error);
    }

    @media (max-width: 380px) {
      .container {
        padding-right: 16px;
        padding-left: 16px;
      }

      .datetime-row {
        grid-template-columns: minmax(0, 1fr) 74px 74px;
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>ポーカー体験会 お申し込み</h1>

    <div class="description">
      ご希望の日時を第3希望までご入力ください。<br>
      ※フォーム送信時点では、ご予約はまだ確定しておりません。
    </div>

    <form id="reservationForm">

      <div class="field">
        <label for="representativeName">
          代表者名（ニックネーム可）
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          id="representativeName"
          required
        >
      </div>

      <div class="field">
        <label for="guestCount">
          ご来場人数
          <span class="required">必須</span>
        </label>

        <select id="guestCount" required>
          <option value="">選択してください</option>
          <option value="1名">1名</option>
          <option value="2名">2名</option>
          <option value="3名">3名</option>
          <option value="4名">4名</option>
          <option value="5名">5名</option>
          <option value="6名">6名</option>
          <option value="7名">7名</option>
          <option value="8名">8名</option>
          <option value="9名">9名</option>
          <option value="10名以上">10名以上</option>
        </select>
      </div>

      <div class="field">
        <label>
          第1希望日時
          <span class="required">必須</span>
        </label>

        <div class="datetime-row">
          <input
            type="date"
            id="firstDate"
            aria-label="第1希望日"
            required
          >

          <select id="firstHour" aria-label="第1希望 時" required>
            <option value="">時</option>
            <option value="17">17時</option>
            <option value="18">18時</option>
            <option value="19">19時</option>
            <option value="20">20時</option>
            <option value="21">21時</option>
          </select>

          <select id="firstMinute" aria-label="第1希望 分" required>
            <option value="">分</option>
            <option value="00">00分</option>
            <option value="15">15分</option>
            <option value="30">30分</option>
            <option value="45">45分</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>
          第2希望日時
          <span class="required">必須</span>
        </label>

        <div class="datetime-row">
          <input
            type="date"
            id="secondDate"
            aria-label="第2希望日"
            required
          >

          <select id="secondHour" aria-label="第2希望 時" required>
            <option value="">時</option>
            <option value="17">17時</option>
            <option value="18">18時</option>
            <option value="19">19時</option>
            <option value="20">20時</option>
            <option value="21">21時</option>
          </select>

          <select id="secondMinute" aria-label="第2希望 分" required>
            <option value="">分</option>
            <option value="00">00分</option>
            <option value="15">15分</option>
            <option value="30">30分</option>
            <option value="45">45分</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>
          第3希望日時
          <span class="required">必須</span>
        </label>

        <div class="datetime-row">
          <input
            type="date"
            id="thirdDate"
            aria-label="第3希望日"
            required
          >

          <select id="thirdHour" aria-label="第3希望 時" required>
            <option value="">時</option>
            <option value="17">17時</option>
            <option value="18">18時</option>
            <option value="19">19時</option>
            <option value="20">20時</option>
            <option value="21">21時</option>
          </select>

          <select id="thirdMinute" aria-label="第3希望 分" required>
            <option value="">分</option>
            <option value="00">00分</option>
            <option value="15">15分</option>
            <option value="30">30分</option>
            <option value="45">45分</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="note">
          備考・ご質問
          <span class="optional">任意</span>
        </label>

        <textarea
          id="note"
          placeholder="ご質問などがございましたらご入力ください"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submitButton"
        disabled
      >
        読み込み中...
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

    </form>

  </main>

  <script>
    const LIFF_ID = '2011216818-LyOXLWar';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycby1GxM5KK4NwQWnu1sGrEf2EQV5_BI3M0-KYo2K22po29tZJh0sJP_MZEiR5GAe1qy5/exec';

    let lineUserId = '';
    let lineDisplayName = '';

    const form =
      document.getElementById('reservationForm');

    const submitButton =
      document.getElementById('submitButton');

    const message =
      document.getElementById('message');


    // ----------------------------------
    // LIFF初期化
    // ----------------------------------

    async function initializeLiff() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile =
          await liff.getProfile();

        lineUserId =
          profile.userId || '';

        lineDisplayName =
          profile.displayName || '';

        submitButton.disabled = false;
        submitButton.textContent = '申し込む';

      } catch (error) {
        console.error(
          'LIFF initialization failed:',
          error
        );

        showMessage(
          'error',
          'LINEとの接続に失敗しました。LINEからもう一度開いてください。'
        );

        submitButton.disabled = true;
        submitButton.textContent = 'LINE接続エラー';
      }
    }


    // ----------------------------------
    // 今日より前の日付を選択不可
    // ----------------------------------

    function getTodayString() {
      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          now.getDate()
        ).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    const todayString =
      getTodayString();

    [
      'firstDate',
      'secondDate',
      'thirdDate'
    ].forEach(function(id) {
      document.getElementById(id).min =
        todayString;
    });


    // ----------------------------------
    // 曜日付き日時
    // ----------------------------------

    function formatDateTime(
      dateValue,
      hourValue,
      minuteValue
    ) {
      const parts =
        dateValue
          .split('-')
          .map(Number);

      const year = parts[0];
      const month = parts[1];
      const day = parts[2];

      const date =
        new Date(
          year,
          month - 1,
          day
        );

      const weekdays = [
        '日',
        '月',
        '火',
        '水',
        '木',
        '金',
        '土'
      ];

      const weekday =
        weekdays[date.getDay()];

      const formattedMonth =
        String(month).padStart(2, '0');

      const formattedDay =
        String(day).padStart(2, '0');

      return (
        `${year}/${formattedMonth}/${formattedDay}` +
        `（${weekday}）` +
        `${hourValue}:${minuteValue}`
      );
    }


    // ----------------------------------
    // メッセージ表示
    // ----------------------------------

    function showMessage(
      type,
      text
    ) {
      message.className =
        'message ' + type;

      message.textContent =
        text;
    }


    // ----------------------------------
    // 送信
    // ----------------------------------

    form.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        if (!lineUserId) {
          showMessage(
            'error',
            'LINEユーザー情報を取得できませんでした。LINEからもう一度開いてください。'
          );

          return;
        }

        message.className =
          'message';

        message.textContent =
          '';

        const data = {

          representativeName:
            document
              .getElementById('representativeName')
              .value
              .trim(),

          guestCount:
            document
              .getElementById('guestCount')
              .value,

          firstDateTime:
            formatDateTime(
              document.getElementById('firstDate').value,
              document.getElementById('firstHour').value,
              document.getElementById('firstMinute').value
            ),

          secondDateTime:
            formatDateTime(
              document.getElementById('secondDate').value,
              document.getElementById('secondHour').value,
              document.getElementById('secondMinute').value
            ),

          thirdDateTime:
            formatDateTime(
              document.getElementById('thirdDate').value,
              document.getElementById('thirdHour').value,
              document.getElementById('thirdMinute').value
            ),

          note:
            document
              .getElementById('note')
              .value
              .trim(),

          lineUserId:
            lineUserId,

          lineDisplayName:
            lineDisplayName
        };


        submitButton.disabled = true;
        submitButton.textContent = '送信中...';


        try {

          const response =
            await fetch(
              GAS_URL,
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'text/plain;charset=utf-8'
                },

                body:
                  JSON.stringify(data)
              }
            );


          const result =
            await response.json();


          if (!result.success) {
            throw new Error(
              result.message ||
              '送信に失敗しました。'
            );
          }


          showMessage(
            'success',
            'お申し込みを受け付けました。'
          );

          form.reset();


        } catch (error) {

          console.error(error);

          showMessage(
            'error',
            '送信に失敗しました。時間をおいてもう一度お試しください。'
          );


        } finally {

          submitButton.disabled = false;
          submitButton.textContent = '申し込む';

        }
      }
    );


    // ----------------------------------
    // 起動
    // ----------------------------------

    initializeLiff();
  </script>

</body>
</html>
